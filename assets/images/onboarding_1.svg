<svg viewBox="0 0 200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="200" height="300" fill="url(#gradient1)"/>

  <!-- Shopping bag illustration -->
  <g transform="translate(50, 80)">
    <!-- Bag body -->
    <rect x="20" y="40" width="60" height="70" rx="5" fill="white" opacity="0.9"/>

    <!-- Bag handles -->
    <path d="M 35 40 Q 35 20 50 15 Q 65 20 65 40" stroke="white" stroke-width="3" fill="none"/>

    <!-- Items in bag -->
    <rect x="30" y="55" width="15" height="20" rx="2" fill="#6366F1"/>
    <rect x="50" y="55" width="15" height="20" rx="2" fill="#8B5CF6"/>

    <!-- Price tag -->
    <circle cx="65" cy="50" r="12" fill="#FFD700"/>
    <text x="65" y="55" text-anchor="middle" font-size="16" font-weight="bold" fill="#000">$</text>
  </g>
</svg>

