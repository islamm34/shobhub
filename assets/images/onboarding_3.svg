<svg viewBox="0 0 200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F97316;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="200" height="300" fill="url(#gradient3)"/>

  <!-- Truck/Package tracking -->
  <g transform="translate(30, 100)">
    <!-- Package box -->
    <rect x="10" y="20" width="50" height="45" rx="3" fill="white" opacity="0.95" stroke="#F97316" stroke-width="2"/>

    <!-- Box flaps -->
    <path d="M 15 20 L 20 15 L 55 15 L 60 20" fill="#F97316" opacity="0.7"/>

    <!-- Location pin -->
    <circle cx="90" cy="25" r="15" fill="#F97316"/>
    <path d="M 90 20 L 85 35 Q 90 42 95 35 Z" fill="white"/>

    <!-- Track line -->
    <path d="M 50 60 Q 70 55 90 65" stroke="white" stroke-width="2" fill="none" stroke-dasharray="5,5" opacity="0.8"/>

    <!-- Moving indicator -->
    <circle cx="85" cy="65" r="4" fill="white"/>
  </g>
</svg>

