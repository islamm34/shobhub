<svg viewBox="0 0 200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="200" height="300" fill="url(#gradient2)"/>

  <!-- Security Shield -->
  <g transform="translate(50, 70)">
    <!-- Shield shape -->
    <path d="M 50 10 L 90 30 L 90 70 Q 50 100 50 100 Q 10 100 10 70 L 10 30 Z" fill="white" opacity="0.95" stroke="#EC4899" stroke-width="2"/>

    <!-- Lock in center -->
    <rect x="38" y="50" width="24" height="20" rx="2" fill="#EC4899"/>
    <circle cx="50" cy="55" r="4" fill="white"/>

    <!-- Checkmark -->
    <path d="M 55 65 L 60 72 L 72 55" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

